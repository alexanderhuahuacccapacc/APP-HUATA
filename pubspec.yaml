name: recojo_leche
description: Aplicación móvil offline-first para el recojo de leche en zonas rurales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Almacenamiento local (base de datos SQLite)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Persistencia de sesión del usuario
  shared_preferences: ^2.2.3

  # Generación de identificadores únicos para cada registro
  uuid: ^4.4.0

  # Formato de fechas en español
  intl: ^0.19.0

  # Iconos (incluidos por Flutter)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
